<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GroceryMate{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    .bg-grocery { background: #1f6f4a; }
    .scroll-box { max-height: 70vh; overflow-y: auto; }
    .product { cursor: pointer; text-transform: capitalize; }
    .cap { text-transform: capitalize; }
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-grocery mb-4">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-basket2-fill"></i> GroceryMate</a>
    <div>
      <a class="btn btn-sm btn-outline-light me-2" href="/">Shop</a>
      <a class="btn btn-sm btn-outline-light" href="/analytics">Analytics</a>
    <a class="btn btn-sm btn-outline-light ms-2" href="/about">About</a>
    </div>
  </div>
</nav>
<div class="container pb-5">{% block content %}{% endblock %}</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
